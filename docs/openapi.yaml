openapi: 3.1.0
info:
  title: API de Facturación Electrónica SRI (Ecuador)
  description: |
    Microservicio de emisión de comprobantes electrónicos ante el SRI.
    Soporta los **seis tipos**: factura, nota de crédito, nota de débito,
    comprobante de retención, guía de remisión y liquidación de compra.

    El servicio encapsula la generación de la clave de acceso, la firma
    XAdES-BES (con el certificado del contribuyente, almacenado en el
    servicio), el ciclo recepción → autorización con el SRI y el registro
    del resultado.

    **Flujo de integración**
    1. `POST /tokens` — obtener un token de API (usarlo como `Bearer`).
    2. `PUT /contribuyente/certificado` — cargar el certificado de firma
       una sola vez (se guarda cifrado).
    3. `POST /comprobantes` — emitir. El certificado **no** viaja en la
       petición.

    **Modalidades de emisión**
    - *Síncrona* (por defecto): la respuesta llega cuando el SRI resuelve
      (puede tardar varios segundos). Recomendada para pruebas y bajo volumen.
    - *Asíncrona* (`?async=1`): responde `202` de inmediato con un `id` y
      con la `claveAcceso` **ya generada**; el estado se consulta con
      `GET /comprobantes/{id}`. La clave no depende del SRI, así que quien
      emite puede imprimir el comprobante para su cliente sin esperar la
      autorización.

    **Integración de partners/plataformas**

    Un partner (POS, ERP…) emite en nombre de sus clientes con **una sola
    credencial** (token de partner, emitido al abrir la relación comercial):

    1. `POST /partner/v1/contribuyentes` — aprovisionar al cliente final
       (idempotente por RUC). El `id` devuelto identifica al contribuyente.
    2. `PUT /contribuyente/certificado` **con la cabecera
       `X-Contribuyente: {id}`** — cargar el certificado del cliente.
    3. Usar cualquier endpoint de esta API con esa misma cabecera para
       actuar a nombre del contribuyente gestionado.

    Con token de usuario directo la cabecera no aplica. Los campos
    `external_id` y `metadata` de la emisión permiten al integrador
    reconciliar los comprobantes contra su propio sistema.

    **Webhooks**

    En vez de hacer polling, registra un endpoint HTTPS y recibe los
    eventos `comprobante.autorizado`, `comprobante.devuelto`,
    `comprobante.no_autorizado`, `comprobante.fallido` y
    `certificado.por_vencer`. Un endpoint de **partner** recibe los
    eventos de todos sus contribuyentes gestionados; uno de
    **contribuyente**, solo los suyos.

    Cada entrega es un `POST` JSON con cabeceras `X-Evento`, `X-Entrega`
    (id de la entrega) y firma HMAC-SHA256:

    ```
    X-Firma: v1={HMAC_SHA256(secreto, timestamp + "." + cuerpo)}
    X-Firma-Timestamp: {unix}
    ```

    El secreto se muestra **una sola vez** al crear el endpoint. Responde
    `2xx` cuanto antes: cualquier otra respuesta se reintenta con backoff
    (1 min, 5 min, 30 min, 2 h; máx. 5 intentos) y el resultado de cada
    intento queda consultable en el registro de entregas. El XML firmado
    no viaja en el evento: descárgalo por la API con el `id` recibido.

    **Idempotencia**

    Ante un timeout o corte de red, reintenta la emisión con la misma
    cabecera `Idempotency-Key` (p. ej. el id de tu venta): si la petición
    original llegó a procesarse, recibirás **su misma respuesta** (con la
    cabecera `Idempotency-Replayed: true`) en vez de emitirse un duplicado.
    Reutilizar una clave con otro payload responde `409`; si la petición
    original sigue en curso, también `409` (reintenta en unos segundos).
    Las claves expiran a las 24 h. Solo se guardan desenlaces de negocio:
    ante un `5xx` o un `429` la clave queda libre para reintentar.
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /tokens:
    post:
      summary: Obtener un token de API
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string, description: Nombre descriptivo del integrador/dispositivo. }
      responses:
        '201':
          description: Token emitido (usarlo como Bearer).
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '422':
          description: Credenciales incorrectas.
  /catalogos:
    get:
      summary: Catálogos disponibles de la ficha técnica
      security: []
      responses:
        '200':
          description: Lista de catálogos con su URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        clave: { type: string }
                        nombre: { type: string }
                        url: { type: string, format: uri }
  /catalogos/codigos-auxiliares:
    get:
      summary: Códigos del segundo código del ítem por actividad regulada
      security: []
      description: |
        Tablas 31 y 32 de la ficha técnica (Anexos 23 y 25 §1): los códigos
        que el SRI exige en el segundo código de cada ítem cuando la venta
        pertenece a una actividad regulada — materiales de construcción y
        transporte comercial excepto taxis.

        Público y cacheable: son datos de una norma publicada, iguales para
        todos. Se sirve con `ETag`; revalide con `If-None-Match` y recibirá
        `304` mientras no cambie. Consúmalo para construir su selector de
        producto en vez de transcribir la tabla.

        **El servicio no valida el contenido del campo**: es el código
        auxiliar de uso general del emisor (barras, SKU…) y la obligación
        es por ítem, algo que solo el emisor sabe. Este catálogo es la
        referencia para clasificar sus productos, no una lista cerrada.

        `tagXml` dice en qué etiqueta va el código según el tipo de
        comprobante: la nota de crédito llama `codigoAdicional` a lo que la
        factura y la liquidación llaman `codigoAuxiliar`.
      responses:
        '200':
          description: Catálogo vigente.
          headers:
            ETag:
              schema: { type: string }
              description: Para revalidar con If-None-Match.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ficha: { type: string, description: 'Versión de la ficha técnica de la que se transcribió (p. ej. 2.34).' }
                  version: { type: string, format: date, description: 'Cambia cuando cambia el contenido del catálogo.' }
                  grupos:
                    type: array
                    items:
                      type: object
                      properties:
                        clave: { type: string, enum: [materiales_construccion, transporte_comercial] }
                        nombre: { type: string }
                        anexo: { type: integer }
                        tabla: { type: integer }
                        baseLegal: { type: [string, 'null'], description: 'Resolución que lo establece, si la ficha la cita.' }
                        obligatorioDesde: { type: [string, 'null'], format: date }
                        tagXml:
                          type: object
                          additionalProperties: { type: string }
                          description: 'Tipo de comprobante → etiqueta XML donde va el código.'
                        codigos:
                          type: array
                          items:
                            type: object
                            properties:
                              codigo: { type: string, maxLength: 25 }
                              descripcion: { type: string }
        '304':
          description: El catálogo no cambió desde el ETag enviado.
  /catalogos/formas-pago:
    get:
      summary: Formas de pago del bloque pagos (Tabla 24)
      security: []
      description: |
        Tabla 24 de la ficha técnica: los códigos admitidos en
        `infoFactura.pagos.pago.formaPago` y en el mismo campo de la nota de
        débito y la liquidación de compra.

        **A diferencia de los códigos auxiliares, esta lista es cerrada**:
        el servicio rechaza con `422` un `formaPago` que no esté aquí, de
        modo que un código retirado (02 a 14, que existieron y ya no) o
        inventado se detecta al emitir y no al recibir el rechazo del SRI.
        Por eso la respuesta trae `validado: true`.

        `unidadTiempo`, el otro campo libre del bloque, **no tiene catálogo**:
        la ficha lo declara texto de hasta 10 caracteres y solo lo ejemplifica
        con `dias`.

        Público y cacheable, con `ETag`, igual que los demás catálogos.
      responses:
        '200':
          description: Catálogo vigente.
          headers:
            ETag:
              schema: { type: string }
              description: Para revalidar con If-None-Match.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ficha: { type: string, example: '2.34' }
                  version: { type: string, format: date }
                  tabla: { type: integer, example: 24 }
                  validado: { type: boolean, description: 'true: el servicio rechaza códigos fuera de esta lista.' }
                  codigos:
                    type: array
                    items:
                      type: object
                      properties:
                        codigo: { type: string, example: '01' }
                        nombre: { type: string, example: Sin utilización del sistema financiero }
                        desde: { type: string, format: date, description: 'Fecha desde la que el SRI admite el código.' }
        '304':
          description: El catálogo no cambió desde el ETag enviado.
  /contribuyente/certificado:
    put:
      summary: Cargar o reemplazar el certificado de firma del contribuyente
      description: >
        El certificado se valida al cargarlo (la clave debe abrirlo y no debe
        estar vencido), se almacena cifrado en reposo y se usa en todas las
        emisiones. Soporta certificados `.p12` modernos y legacy (RC2/3DES).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p12, clave]
              properties:
                p12: { type: string, description: 'Certificado .p12 en base64 (máx. ~90 KB).' }
                clave: { type: string, description: Contraseña del certificado. }
      parameters:
        - $ref: '#/components/parameters/XContribuyente'
      responses:
        '204': { description: Certificado válido y guardado. }
        '403': { description: El usuario no pertenece a ningún contribuyente. }
        '422':
          description: >
            Certificado inválido: la clave es incorrecta, el archivo no es un
            `.p12` válido, o el certificado está vencido.
  /comprobantes:
    post:
      summary: Emitir un comprobante electrónico
      description: |
        La primera clave del cuerpo identifica el tipo de comprobante:
        `factura`, `notaCredito`, `notaDebito`, `comprobanteRetencion`,
        `guiaRemision` o `liquidacionCompra`.

        El certificado de firma **no** se envía en la petición: se usa el que
        el contribuyente cargó con `PUT /contribuyente/certificado`.

        El RUC de `infoTributaria` debe coincidir con el del contribuyente
        autenticado. El `codDoc` y la `claveAcceso` del payload se ignoran: el
        servicio deriva el código del tipo y genera la clave de acceso (con
        código numérico aleatorio por comprobante).
      parameters:
        - name: async
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Si es verdadero, encola la emisión y responde 202.
        - $ref: '#/components/parameters/XContribuyente'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                external_id:
                  type: string
                  maxLength: 255
                  description: Id del comprobante en el sistema origen (trazabilidad del integrador).
                metadata:
                  type: object
                  description: Metadatos libres del integrador; se devuelven tal cual en las consultas.
                factura: { $ref: '#/components/schemas/ComprobantePayload' }
                notaCredito: { $ref: '#/components/schemas/ComprobantePayload' }
                notaDebito: { $ref: '#/components/schemas/ComprobantePayload' }
                comprobanteRetencion: { $ref: '#/components/schemas/ComprobantePayload' }
                guiaRemision: { $ref: '#/components/schemas/ComprobantePayload' }
                liquidacionCompra: { $ref: '#/components/schemas/ComprobantePayload' }
            example:
              factura:
                infoTributaria:
                  ambiente: '1'
                  tipoEmision: '1'
                  razonSocial: MI EMPRESA S.A.
                  ruc: '0922596788001'
                  estab: '001'
                  ptoEmi: '001'
                  secuencial: '000000001'
                  dirMatriz: Av. Principal 100
                infoFactura:
                  fechaEmision: 10/07/2026
                  obligadoContabilidad: 'SI'
                  tipoIdentificacionComprador: '05'
                  razonSocialComprador: Juan Pérez
                  identificacionComprador: '0912345675'
                  totalSinImpuestos: '100.00'
                  totalDescuento: '0.00'
                  totalConImpuestos:
                    totalImpuesto:
                      - { codigo: '2', codigoPorcentaje: '4', baseImponible: '100.00', tarifa: '15.00', valor: '15.00' }
                  importeTotal: '115.00'
                  moneda: DOLAR
                detalles:
                  detalle:
                    - codigoPrincipal: SERV-01
                      descripcion: Servicio de consultoría
                      cantidad: '1.00'
                      precioUnitario: '100.00'
                      descuento: '0.00'
                      precioTotalSinImpuesto: '100.00'
                      impuestos:
                        impuesto: { codigo: '2', codigoPorcentaje: '4', tarifa: '15.00', baseImponible: '100.00', valor: '15.00' }
      responses:
        '200':
          description: Emisión síncrona autorizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmisionSincrona' }
        '202':
          description: >
            Emisión asíncrona encolada. La respuesta ya incluye la
            `claveAcceso` definitiva: la emisión se procesará con esa misma
            clave.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Comprobante' }
        '401':
          description: Sin token o token inválido.
        '409':
          description: El contribuyente no tiene certificado de firma configurado.
        '422':
          description: >
            Payload inválido, o (en modalidad síncrona) el SRI devolvió o no
            autorizó el comprobante.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmisionFallida' }
        '429':
          description: Límite de peticiones excedido o cuota mensual del plan agotada.
    get:
      summary: Listar las emisiones del contribuyente
      description: >
        Listado paginado (25 por página, más recientes primero). El filtro
        `external_id` permite recuperar un comprobante por el id del sistema
        origen (p. ej. si se perdió la respuesta de la emisión).
      parameters:
        - $ref: '#/components/parameters/XContribuyente'
        - name: external_id
          in: query
          required: false
          schema: { type: string }
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [pendiente, firmado, recibido, autorizado, devuelto, no_autorizado, fallido] }
      responses:
        '200':
          description: Página de emisiones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Comprobante' }
  /comprobantes/{id}:
    get:
      summary: Consultar el estado de una emisión
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XContribuyente'
      responses:
        '200':
          description: Estado y resultado de la emisión.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Comprobante' }
        '404':
          description: No existe una emisión con ese id.
  /comprobantes/{id}/reintentar:
    post:
      summary: Reintentar una emisión rechazada
      description: >
        Reenvía el comprobante corregido reutilizando **la misma clave de
        acceso y secuencial** del intento fallido (ficha del SRI, §5.10).
        Solo aplica a emisiones en estado `devuelto`, `no_autorizado` o
        `fallido`. Los componentes de la clave (fecha, tipo, RUC, ambiente,
        serie, secuencial) no pueden cambiar en el payload corregido. El
        registro se reutiliza (mismo id), por lo que el reintento no
        consume cuota adicional. Admite `?async=1` igual que la emisión.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: async
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/XContribuyente'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: El comprobante corregido, con la misma forma que en la emisión.
      responses:
        '200':
          description: Reintento síncrono autorizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmisionSincrona' }
        '202':
          description: Reintento asíncrono encolado.
        '404':
          description: No existe la emisión (o pertenece a otro contribuyente).
        '409':
          description: El estado actual no admite reintento.
        '422':
          description: >
            Payload inválido, componentes de la clave modificados, tipo
            distinto al original, o el SRI volvió a rechazar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmisionFallida' }
  /comprobantes/{id}/ride:
    get:
      summary: Descargar el RIDE (PDF) de un comprobante autorizado
      description: >
        Representación impresa del documento electrónico (Anexo 2 de la
        ficha del SRI), generada desde el XML firmado. Se cachea tras la
        primera descarga.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XContribuyente'
      responses:
        '200':
          description: El RIDE en PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404':
          description: No existe la emisión o su XML ya no está disponible.
        '409':
          description: El comprobante aún no está autorizado.
  /webhooks:
    post:
      summary: Registrar un endpoint de webhook
      description: >
        Suscribe una URL a eventos del contribuyente actual. La respuesta
        incluye el `secreto` de firma **una sola vez**. (El plano de partner
        tiene su equivalente en `POST /api/partner/v1/webhooks`, suscrito a
        los eventos de todos sus gestionados.)
      parameters:
        - $ref: '#/components/parameters/XContribuyente'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, eventos]
              properties:
                url: { type: string, format: uri, description: URL http(s) del receptor. }
                eventos:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/EventoWebhook' }
      responses:
        '201':
          description: Endpoint registrado; el secreto solo viaja aquí.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WebhookEndpoint' }
                  secreto: { type: string, description: Guardarlo ahora; no se puede volver a consultar. }
        '422':
          description: URL o eventos inválidos.
    get:
      summary: Listar los endpoints de webhook
      parameters:
        - $ref: '#/components/parameters/XContribuyente'
      responses:
        '200':
          description: Endpoints registrados (sin el secreto).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookEndpoint' }
  /webhooks/{id}:
    delete:
      summary: Eliminar un endpoint de webhook
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XContribuyente'
      responses:
        '204': { description: Endpoint eliminado (junto con su registro de entregas). }
        '404': { description: No existe (o pertenece a otro suscriptor). }
  /webhooks/{id}/entregas:
    get:
      summary: Consultar el registro de entregas de un endpoint
      description: >
        Listado paginado (25 por página, más recientes primero) del
        resultado de cada notificación: estado, intentos, código HTTP,
        error y payload. Útil para depurar la integración.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XContribuyente'
      responses:
        '200':
          description: Página de entregas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookEntrega' }
        '404': { description: No existe (o pertenece a otro suscriptor). }
  /contribuyentes:
    servers:
      - url: /api/partner/v1
    post:
      summary: 'Partners: aprovisionar un contribuyente gestionado'
      description: >
        Da de alta al cliente final del partner sin registro en el panel.
        Idempotente por RUC dentro del partner: repetir la llamada devuelve
        el contribuyente existente (200) en vez de crearlo (201). Requiere
        token de partner (403 con token de usuario directo). El contribuyente
        nace sin certificado; se carga después con
        `PUT /api/v1/contribuyente/certificado` + `X-Contribuyente`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruc, razon_social]
              properties:
                ruc: { type: string, description: 13 dígitos. }
                razon_social: { type: string, maxLength: 255 }
                nombre_comercial: { type: string, maxLength: 255 }
                dir_matriz: { type: string, maxLength: 255 }
                limite_mensual:
                  type: [integer, 'null']
                  minimum: 1
                  description: Sublímite de emisiones mensuales dentro de la cuota pool (null = sin sublímite).
                agente_retencion_resolucion:
                  type: [string, 'null']
                  description: |
                    Nº de resolución que designa al contribuyente Agente de Retención
                    (ficha técnica, Anexo 21). Hasta 8 dígitos; los ceros a la izquierda
                    se descartan. `fe` lo imprime como `<agenteRetencion>` en cada
                    comprobante. Null o vacío = no designado.
                contribuyente_especial_resolucion:
                  type: [string, 'null']
                  description: |
                    Nº de resolución de Contribuyente Especial (3 a 13 caracteres
                    alfanuméricos). `fe` lo imprime como `<contribuyenteEspecial>` en
                    cada comprobante. Null o vacío = no designado.
                regimen_rimpe:
                  type: [string, 'null']
                  enum: [rimpe, negocio_popular, null]
                  description: |
                    Régimen RIMPE del emisor (ficha técnica, Anexo 22). `fe` imprime la
                    leyenda literal en `<contribuyenteRimpe>` y en el RIDE:
                    `rimpe` → "CONTRIBUYENTE RÉGIMEN RIMPE";
                    `negocio_popular` → "CONTRIBUYENTE NEGOCIO POPULAR - RÉGIMEN RIMPE".
                    Null o vacío = régimen general.
                gran_contribuyente_resolucion:
                  type: [string, 'null']
                  maxLength: 300
                  description: |
                    Nº de resolución que califica al emisor como Gran Contribuyente
                    (ficha técnica, Anexo 24; p. ej. `NAC-GCFOIOC21-00000868-E`). `fe` lo
                    emite como `<campoAdicional nombre="Gran Contribuyente">` en facturas,
                    liquidaciones de compra y notas de crédito y débito. Null o vacío = no
                    calificado.
      responses:
        '201':
          description: Contribuyente aprovisionado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ContribuyenteGestionado' }
        '200':
          description: El RUC ya estaba aprovisionado por este partner (idempotencia).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ContribuyenteGestionado' }
        '403':
          description: El token no es de partner.
        '409':
          description: El RUC ya está registrado en otra cuenta del servicio.
        '422':
          description: Payload inválido (p. ej. RUC malformado).
    get:
      summary: 'Partners: listar contribuyentes gestionados'
      description: Listado paginado (25 por página) con filtro opcional `ruc` exacto.
      parameters:
        - name: ruc
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Página de contribuyentes gestionados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ContribuyenteGestionado' }
        '403':
          description: El token no es de partner.
  /contribuyentes/{id}:
    servers:
      - url: /api/partner/v1
    patch:
      summary: 'Partners: actualizar un contribuyente gestionado'
      description: >
        Actualiza los datos editables (razón social, nombre comercial,
        dirección) y el sublímite mensual dentro de la cuota pool
        (`limite_mensual`; enviar null lo quita). El RUC no se edita.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                razon_social: { type: string, maxLength: 255 }
                nombre_comercial: { type: [string, 'null'], maxLength: 255 }
                dir_matriz: { type: [string, 'null'], maxLength: 255 }
                limite_mensual: { type: [integer, 'null'], minimum: 1 }
                agente_retencion_resolucion:
                  type: [string, 'null']
                  description: |
                    Nº de resolución que designa al contribuyente Agente de Retención
                    (ficha técnica, Anexo 21). Hasta 8 dígitos; los ceros a la izquierda
                    se descartan. `fe` lo imprime como `<agenteRetencion>` en cada
                    comprobante. Null o vacío = no designado.
                contribuyente_especial_resolucion:
                  type: [string, 'null']
                  description: |
                    Nº de resolución de Contribuyente Especial (3 a 13 caracteres
                    alfanuméricos). `fe` lo imprime como `<contribuyenteEspecial>` en
                    cada comprobante. Null o vacío = no designado.
                regimen_rimpe:
                  type: [string, 'null']
                  enum: [rimpe, negocio_popular, null]
                  description: |
                    Régimen RIMPE del emisor (ficha técnica, Anexo 22). `fe` imprime la
                    leyenda literal en `<contribuyenteRimpe>` y en el RIDE:
                    `rimpe` → "CONTRIBUYENTE RÉGIMEN RIMPE";
                    `negocio_popular` → "CONTRIBUYENTE NEGOCIO POPULAR - RÉGIMEN RIMPE".
                    Null o vacío = régimen general.
                gran_contribuyente_resolucion:
                  type: [string, 'null']
                  maxLength: 300
                  description: |
                    Nº de resolución que califica al emisor como Gran Contribuyente
                    (ficha técnica, Anexo 24; p. ej. `NAC-GCFOIOC21-00000868-E`). `fe` lo
                    emite como `<campoAdicional nombre="Gran Contribuyente">` en facturas,
                    liquidaciones de compra y notas de crédito y débito. Null o vacío = no
                    calificado.
      responses:
        '200':
          description: Contribuyente actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ContribuyenteGestionado' }
        '404': { description: No existe (o pertenece a otro partner). }
  /contribuyentes/{id}/enlace-certificado:
    servers:
      - url: /api/partner/v1
    post:
      summary: 'Partners: generar el enlace hospedado de carga de certificado'
      description: >
        Devuelve una URL firmada y temporal para compartir con el cliente
        final: en ella sube su certificado .p12 y su clave **directamente al
        servicio** — la clave privada nunca pasa por el sistema del partner.
        Se puede regenerar cuando haga falta; cada enlace expira solo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Enlace generado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expiraEn: { type: string, format: date-time }
        '404': { description: No existe (o pertenece a otro partner). }
  /vinculaciones:
    servers:
      - url: /api/partner/v1
    post:
      summary: 'Partners: solicitar la vinculación de un RUC ya registrado'
      description: >
        Cuando el aprovisionamiento responde 409 (el RUC ya tiene cuenta
        directa), este endpoint crea una solicitud de vinculación que el
        dueño de la cuenta aprueba o rechaza desde su panel. Al aprobarse,
        el contribuyente pasa a ser gestionado por el partner (emisión
        on-behalf y cuota pool). Idempotente mientras la solicitud siga
        pendiente. Consulte el estado con GET.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruc]
              properties:
                ruc: { type: string, description: 13 dígitos. }
      responses:
        '201':
          description: Solicitud creada (pendiente de aprobación del dueño).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vinculacion' }
        '200':
          description: Ya había una solicitud pendiente para ese RUC (idempotencia).
        '404': { description: El RUC no está registrado en el servicio (aprovisiónelo). }
        '409': { description: El contribuyente ya es gestionado (por este u otro partner). }
    get:
      summary: 'Partners: listar solicitudes de vinculación'
      responses:
        '200':
          description: Página de solicitudes con su estado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Vinculacion' }
  /partner/v1/webhooks:
    servers:
      - url: /api
    post:
      summary: 'Partners: registrar un endpoint de webhook global'
      description: >
        Igual que `POST /api/v1/webhooks`, pero el endpoint queda suscrito a
        los eventos de **todos** los contribuyentes gestionados del partner
        (el payload identifica al contribuyente de cada evento). Los demás
        recursos son equivalentes: `GET /api/partner/v1/webhooks`,
        `DELETE /api/partner/v1/webhooks/{id}` y
        `GET /api/partner/v1/webhooks/{id}/entregas`. Requiere token de
        partner (403 en caso contrario).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, eventos]
              properties:
                url: { type: string, format: uri }
                eventos:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/EventoWebhook' }
      responses:
        '201':
          description: Endpoint registrado; el secreto solo viaja aquí.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WebhookEndpoint' }
                  secreto: { type: string }
        '403':
          description: El token no es de partner.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Token personal emitido en POST /tokens (usuarios directos) o token
        de partner (emitido al abrir la relación comercial). Laravel Sanctum.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
      description: >
        Clave de idempotencia (única por contribuyente, p. ej. el id de la
        venta en tu sistema). Reintentar con la misma clave y el mismo
        payload devuelve la respuesta original (`Idempotency-Replayed:
        true`) sin duplicar la emisión; con otro payload responde 409.
        Expira a las 24 h.
    XContribuyente:
      name: X-Contribuyente
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: >
        Solo con token de partner: id del contribuyente gestionado a cuyo
        nombre se actúa. Obligatoria en ese caso (400 si falta; 404 si el
        contribuyente no pertenece al partner). Con token de usuario directo
        se ignora.
  schemas:
    EventoWebhook:
      type: string
      enum:
        - comprobante.autorizado
        - comprobante.devuelto
        - comprobante.no_autorizado
        - comprobante.fallido
        - certificado.por_vencer
    WebhookEndpoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        eventos:
          type: array
          items: { $ref: '#/components/schemas/EventoWebhook' }
        activo: { type: boolean }
        creadoEn: { type: string, format: date-time }
    WebhookEntrega:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: El mismo valor que la cabecera X-Entrega recibida.
        evento: { $ref: '#/components/schemas/EventoWebhook' }
        estado: { type: string, enum: [pendiente, entregada, fallida] }
        intentos: { type: integer }
        codigoHttp: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }
        payload: { $ref: '#/components/schemas/EventoWebhookPayload' }
        entregadoEn: { type: [string, 'null'], format: date-time }
        creadoEn: { type: string, format: date-time }
    EventoWebhookPayload:
      type: object
      description: >
        Cuerpo del POST que recibe el endpoint suscrito. En los eventos de
        comprobante, `datos` tiene la forma del schema Comprobante (sin
        `xmlFirmado`); en certificado.por_vencer trae `titular`,
        `validoHasta` y `diasRestantes`.
      properties:
        evento: { $ref: '#/components/schemas/EventoWebhook' }
        publicadoEn: { type: string, format: date-time }
        contribuyente:
          type: object
          properties:
            id: { type: string, format: uuid }
            ruc: { type: string }
        datos: { type: object }
    ContribuyenteGestionado:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Valor a usar en la cabecera X-Contribuyente.
        ruc: { type: string }
        razonSocial: { type: string }
        nombreComercial: { type: [string, 'null'] }
        dirMatriz: { type: [string, 'null'] }
        agenteRetencionResolucion:
          type: [string, 'null']
          description: Leyenda Agente de Retención impresa en cada comprobante (Anexo 21).
        contribuyenteEspecialResolucion:
          type: [string, 'null']
          description: Leyenda Contribuyente Especial impresa en cada comprobante.
        regimenRimpe:
          type: [string, 'null']
          enum: [rimpe, negocio_popular, null]
          description: Régimen RIMPE cuya leyenda se imprime en cada comprobante (Anexo 22).
        granContribuyenteResolucion:
          type: [string, 'null']
          description: Resolución de Gran Contribuyente emitida como campo adicional (Anexo 24).
        certificado:
          type: object
          properties:
            configurado: { type: boolean }
            titular: { type: [string, 'null'] }
            validoHasta: { type: [string, 'null'], format: date-time }
        emisionesDelMes: { type: integer }
        limiteMensual:
          type: [integer, 'null']
          description: Sublímite mensual dentro de la cuota pool (null = sin sublímite).
        creadoEn: { type: string, format: date-time }
    Vinculacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        ruc: { type: string }
        razonSocial: { type: string }
        estado: { type: string, enum: [pendiente, aprobada, rechazada] }
        contribuyente:
          type: string
          format: uuid
          description: Presente solo al aprobarse; es el valor para X-Contribuyente.
        solicitadaEn: { type: string, format: date-time }
        resueltaEn: { type: [string, 'null'], format: date-time }
    ComprobantePayload:
      type: object
      description: |
        Estructura del comprobante según la ficha técnica del SRI. Todos los
        tipos comparten el bloque `infoTributaria`; el resto de bloques
        depende del tipo:

        - **factura** · `infoFactura` + `detalles`
        - **notaCredito** · `infoNotaCredito` + `detalles`
        - **notaDebito** · `infoNotaDebito` + `motivos`
        - **comprobanteRetencion** · `infoCompRetencion` + `impuestos`
        - **guiaRemision** · `infoGuiaRemision` + `destinatarios`
        - **liquidacionCompra** · `infoLiquidacionCompra` + `detalles`

        Importes como texto (`"100.00"`), fechas en `dd/mm/aaaa`. Ver el
        ejemplo del endpoint de emisión para una factura completa.

        **Leyendas del emisor (ficha técnica 2.34, Anexos 21, 22 y 24).**
        Los tags `agenteRetencion` y `contribuyenteRimpe` (en
        `infoTributaria`), `contribuyenteEspecial` (en el bloque `info*`) y
        el campo adicional `Gran Contribuyente` los fija la configuración
        del contribuyente
        —panel o `PATCH /partner/v1/contribuyentes/{id}`— y `fe` los
        inyecta en cada comprobante y en el RIDE. No se envían en el
        payload: si vienen, la emisión responde 422.

        **Segundo código del ítem (ficha técnica 2.34, Anexos 23 y 25 §1).**
        Cada `detalle` admite un segundo código de hasta 25 caracteres
        alfanuméricos: `codigoAuxiliar` en factura y liquidación de compra,
        `codigoAdicional` en nota de crédito (el nombre lo fija el formato
        XML de cada tipo). Es el código auxiliar de uso general del emisor
        (barras, SKU…) y, cuando la venta pertenece a una actividad
        regulada, es donde van los códigos que exige el SRI: materiales de
        construcción (Tabla 31) y transporte comercial excepto taxis
        (Tabla 32). `fe` no valida su contenido.

        Las dos tablas completas se sirven en
        `GET /catalogos/codigos-auxiliares`: consúmalas desde ahí en vez de
        transcribirlas.

        **Placa del vehículo (ficha técnica 2.34, Anexo 25 §2).**
        `infoFactura.placa` es obligatoria en las facturas que las
        operadoras de transporte comercial —excepto taxis— emiten a sus
        clientes. Formato de la Tabla 33: tres letras y cuatro dígitos sin
        espacios (`ABC1234`); si la placa tiene solo tres dígitos se
        rellena con un cero (`ABC0123`). El servicio normaliza mayúsculas,
        separadores y ese cero, y responde 422 si no encaja. Es dato de la
        transacción: lo envía el emisor en cada factura. No confundir con
        el `placa` de la guía de remisión, que es texto libre.
        **Claves desconocidas (desde 2026-09-22).** Cada bloque admite
        exactamente las claves que documenta este esquema: una clave que no
        reconozca —una errata como `codigoAusiliar`, o un campo del SRI que
        el servicio aún no soporte— responde **422** nombrándola y listando
        las admitidas, en vez de descartarse en silencio y autorizar un
        comprobante incompleto. Única excepción: `infoTributaria.codDoc`,
        que se acepta y se descarta porque siempre se deriva del tipo del
        comprobante.
      required: [infoTributaria]
      properties:
        infoTributaria: { $ref: '#/components/schemas/InfoTributaria' }
        infoFactura: { $ref: '#/components/schemas/InfoFactura' }
        infoNotaCredito: { $ref: '#/components/schemas/InfoNotaCredito' }
        detalles:
          type: object
          description: Wrapper del SRI; `detalle` admite un objeto o una lista.
          properties:
            detalle:
              oneOf:
                - { $ref: '#/components/schemas/Detalle' }
                - { type: array, items: { $ref: '#/components/schemas/Detalle' } }
        infoAdicional:
          type: object
          properties:
            campoAdicional:
              oneOf:
                - { $ref: '#/components/schemas/CampoAdicional' }
                - { type: array, items: { $ref: '#/components/schemas/CampoAdicional' } }
    InfoTributaria:
      type: object
      additionalProperties: false
      required: [ambiente, tipoEmision, razonSocial, ruc, estab, ptoEmi, secuencial, dirMatriz]
      properties:
        ambiente: { type: string, enum: ['1', '2'], description: '1 = pruebas, 2 = producción.' }
        tipoEmision: { type: string, enum: ['1'], description: 'Normal.' }
        razonSocial: { type: string }
        nombreComercial: { type: string }
        ruc: { type: string, description: 'Debe coincidir con el contribuyente autenticado.' }
        estab: { type: string, description: '3 dígitos.' }
        ptoEmi: { type: string, description: '3 dígitos.' }
        secuencial: { type: string, description: '9 dígitos, único por serie.' }
        dirMatriz: { type: string }
        claveAcceso: { type: string, description: 'Se genera en el servidor; solo se reutiliza en reintentos.' }
        codDoc: { type: string, description: 'Se acepta y se descarta: siempre se deriva del tipo.' }
        agenteRetencion: { type: string, readOnly: true, description: 'Lo fija la configuración del contribuyente (Anexo 21); enviarlo da 422.' }
        contribuyenteRimpe: { type: string, readOnly: true, description: 'Lo fija la configuración del contribuyente (Anexo 22); enviarlo da 422.' }
    InfoFactura:
      type: object
      additionalProperties: false
      required: [fechaEmision, obligadoContabilidad, tipoIdentificacionComprador, razonSocialComprador, identificacionComprador, totalSinImpuestos, totalDescuento, totalConImpuestos, importeTotal, moneda, pagos]
      properties:
        fechaEmision: { type: string, description: 'dd/mm/aaaa.' }
        dirEstablecimiento: { type: string }
        obligadoContabilidad: { type: string, enum: ['SI', 'NO'] }
        tipoIdentificacionComprador: { type: string, enum: ['04', '05', '06', '07', '08'] }
        razonSocialComprador: { type: string }
        identificacionComprador: { type: string }
        totalSinImpuestos: { type: string }
        totalDescuento: { type: string }
        totalConImpuestos:
          type: object
          properties:
            totalImpuesto:
              oneOf:
                - { $ref: '#/components/schemas/TotalImpuesto' }
                - { type: array, items: { $ref: '#/components/schemas/TotalImpuesto' } }
        propina: { type: string }
        importeTotal: { type: string }
        moneda: { type: string, example: DOLAR }
        placa: { type: string, description: 'Anexo 25 §2; obligatoria en las facturas de operadoras de transporte comercial.' }
        pagos:
          type: object
          description: >
            Formas de pago. **Obligatorio**, como en la ficha: una factura
            sin al menos un `<pago>` se rechaza con 422. Los códigos válidos
            de `formaPago` los publica `GET /catalogos/formas-pago`.
          required: [pago]
          properties:
            pago:
              oneOf:
                - { $ref: '#/components/schemas/Pago' }
                - { type: array, items: { $ref: '#/components/schemas/Pago' } }
        contribuyenteEspecial: { type: string, readOnly: true, description: 'Lo fija la configuración del contribuyente; enviarlo da 422.' }
    Pago:
      type: object
      additionalProperties: false
      required: [formaPago, total]
      properties:
        formaPago:
          type: string
          enum: ['01', '15', '16', '17', '18', '19', '20', '21']
          example: '01'
          description: >
            Código de la Tabla 24. Lista cerrada y validada: ver
            `GET /catalogos/formas-pago`.
        total: { type: string, example: '115.00' }
        plazo: { type: string, description: 'Obligatorio cuando corresponda (pago a crédito).' }
        unidadTiempo: { type: string, description: 'Obligatorio cuando corresponda.', example: dias }
    InfoNotaCredito:
      type: object
      additionalProperties: false
      required: [fechaEmision, tipoIdentificacionComprador, razonSocialComprador, identificacionComprador, codDocModificado, numDocModificado, fechaEmisionDocSustento, totalSinImpuestos, valorModificacion, totalConImpuestos, motivo]
      properties:
        fechaEmision: { type: string, description: 'dd/mm/aaaa.' }
        dirEstablecimiento: { type: string }
        obligadoContabilidad: { type: string, enum: ['SI', 'NO'] }
        tipoIdentificacionComprador: { type: string }
        razonSocialComprador: { type: string }
        identificacionComprador: { type: string }
        codDocModificado: { type: string, description: 'Tipo del documento que se modifica (01 = factura).' }
        numDocModificado: { type: string, example: 001-001-000000001 }
        fechaEmisionDocSustento: { type: string, description: 'dd/mm/aaaa.' }
        totalSinImpuestos: { type: string }
        valorModificacion: { type: string }
        moneda: { type: string, example: DOLAR }
        totalConImpuestos:
          type: object
          properties:
            totalImpuesto:
              oneOf:
                - { $ref: '#/components/schemas/TotalImpuesto' }
                - { type: array, items: { $ref: '#/components/schemas/TotalImpuesto' } }
        motivo: { type: string }
        contribuyenteEspecial: { type: string, readOnly: true, description: 'Lo fija la configuración del contribuyente; enviarlo da 422.' }
    Detalle:
      type: object
      additionalProperties: false
      required: [descripcion, cantidad, precioUnitario, descuento, precioTotalSinImpuesto, impuestos]
      properties:
        codigoPrincipal: { type: string, maxLength: 25, description: 'Código del ítem en factura y liquidación de compra.' }
        codigoInterno: { type: string, maxLength: 25, description: 'Su equivalente en la nota de crédito.' }
        codigoAuxiliar: { type: string, maxLength: 25, description: 'Segundo código en factura y liquidación; ver GET /catalogos/codigos-auxiliares.' }
        codigoAdicional: { type: string, maxLength: 25, description: 'Su equivalente en la nota de crédito.' }
        descripcion: { type: string, maxLength: 300 }
        cantidad: { type: string }
        precioUnitario: { type: string }
        descuento: { type: string }
        precioTotalSinImpuesto: { type: string }
        impuestos:
          type: object
          properties:
            impuesto:
              oneOf:
                - { $ref: '#/components/schemas/Impuesto' }
                - { type: array, items: { $ref: '#/components/schemas/Impuesto' } }
    Impuesto:
      type: object
      additionalProperties: false
      required: [codigo, codigoPorcentaje, tarifa, baseImponible, valor]
      properties:
        codigo: { type: string, example: '2' }
        codigoPorcentaje: { type: string, example: '4' }
        tarifa: { type: string, example: '15.00' }
        baseImponible: { type: string }
        valor: { type: string }
    TotalImpuesto:
      type: object
      additionalProperties: false
      required: [codigo, codigoPorcentaje, baseImponible, valor]
      properties:
        codigo: { type: string }
        codigoPorcentaje: { type: string }
        baseImponible: { type: string }
        valor: { type: string }
        tarifa: { type: string }
    CampoAdicional:
      type: object
      additionalProperties: false
      required: [nombre, valor]
      properties:
        nombre: { type: string }
        valor: { type: string }
    Comprobante:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [factura, notaCredito, notaDebito, comprobanteRetencion, guiaRemision, liquidacionCompra] }
        estado:
          type: string
          enum: [pendiente, firmado, recibido, autorizado, devuelto, no_autorizado, fallido]
        estadoFinal:
          type: boolean
          description: Si es falso, conviene volver a consultar más tarde.
        ambiente: { type: string, enum: ['1', '2'] }
        secuencial: { type: string }
        claveAcceso:
          type: [string, 'null']
          description: >
            49 dígitos; en el esquema offline es también el número de
            autorización. Se calcula al registrar la emisión —antes de
            encolarla y antes de enviar nada al SRI—, así que está presente
            desde el primer momento.
        externalId:
          type: [string, 'null']
          description: Id del comprobante en el sistema origen, si se envió al emitir.
        metadata:
          type: [object, 'null']
          description: Metadatos libres del integrador, si se enviaron al emitir.
        importeTotal: { type: [string, 'null'] }
        emitidoEn: { type: [string, 'null'], format: date }
        autorizacion:
          type: object
          description: Presente solo cuando el estado es `autorizado`.
          properties:
            numero: { type: string }
            fecha: { type: string, format: date-time }
        mensajes:
          type: array
          items: { type: string }
        xmlFirmado:
          type: string
          description: XML firmado en base64; presente solo cuando está autorizado.
    EmisionSincrona:
      type: object
      properties:
        emitido: { type: boolean }
        id: { type: string, format: uuid }
        tipo: { type: string }
        claveAcceso: { type: string }
        autorizacion:
          type: object
          properties:
            estado: { type: string }
            numero: { type: string }
            fecha: { type: string, format: date-time }
            mensajes: { type: array, items: { type: string } }
        xmlFirmado: { type: string, description: XML firmado en base64 }
    EmisionFallida:
      type: object
      description: Respuesta de error de la emisión/reintento síncrono.
      properties:
        emitido: { type: boolean, enum: [false] }
        id: { type: string, format: uuid, description: Id del registro (existe aunque la emisión falle). }
        etapa:
          type: string
          enum: [firma, recepcion, autorizacion, autorizacion_pendiente]
          description: Etapa del pipeline donde falló.
        error: { type: string, description: Mensaje legible del fallo. }
        mensajes:
          type: array
          items: { type: string }
          description: Mensajes crudos del SRI, si los hubo.
        claveAcceso:
          type: [string, 'null']
          description: Presente si la clave llegó a generarse (útil para consultar luego).
